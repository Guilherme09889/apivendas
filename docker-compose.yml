services:
  postgres:
    image: postgres:16
    container_name: demo-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: